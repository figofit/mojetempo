name: Test and deploy Moje tempo

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# Never interrupt an active production deployment with a newer push.
concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Test domain rules and safe packaging
        run: node --test tests/*.test.mjs
      - name: Build public application only
        run: python3 scripts/build_site.py
      - name: Install browser test tools
        run: |
          python3 -m pip install playwright==1.62.0
          python3 -m playwright install --with-deps chromium
      - name: Test packaged application at its project subpath
        shell: bash
        env:
          TEMPO_BASE_URL: http://127.0.0.1:8000/hubnuti/
          TEMPO_ARTIFACTS_DIR: ${{ runner.temp }}/tempo-browser-artifacts
        run: |
          set -euo pipefail
          tempo_serve_root="$(mktemp -d)"
          cp -R dist "$tempo_serve_root/hubnuti"
          python3 -m http.server 8000 --bind 127.0.0.1 --directory "$tempo_serve_root" > "$RUNNER_TEMP/tempo-server.log" 2>&1 &
          tempo_server_pid=$!
          trap 'kill "$tempo_server_pid" 2>/dev/null || true; rm -rf "$tempo_serve_root"' EXIT
          python3 - <<'PY'
          from urllib.request import urlopen
          import time
          for attempt in range(50):
              try:
                  with urlopen('http://127.0.0.1:8000/hubnuti/', timeout=1) as response:
                      assert response.status == 200
                  break
              except (OSError, AssertionError):
                  if attempt == 49:
                      raise
                  time.sleep(0.1)
          PY
          set +e
          python3 tests/browser_smoke.py > "$RUNNER_TEMP/tempo-browser-smoke.jsonl" 2>&1
          tempo_test_status=$?
          set -e
          cat "$RUNNER_TEMP/tempo-browser-smoke.jsonl"
          python3 scripts/ci_summary.py --log "$RUNNER_TEMP/tempo-browser-smoke.jsonl" --name "Packaged browser smoke" --exit-code "$tempo_test_status" || true
          exit "$tempo_test_status"
      - name: Test offline use and safe release updates
        shell: bash
        run: |
          set +e
          python3 tests/pwa_smoke.py > "$RUNNER_TEMP/tempo-pwa-smoke.jsonl" 2>&1
          tempo_test_status=$?
          set -e
          cat "$RUNNER_TEMP/tempo-pwa-smoke.jsonl"
          python3 scripts/ci_summary.py --log "$RUNNER_TEMP/tempo-pwa-smoke.jsonl" --name "Offline and update smoke" --exit-code "$tempo_test_status" || true
          exit "$tempo_test_status"
      - name: Retain smoke-test diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: smoke-test-diagnostics
          retention-days: 7
          path: |
            ${{ runner.temp }}/tempo-browser-smoke.jsonl
            ${{ runner.temp }}/tempo-pwa-smoke.jsonl
            ${{ runner.temp }}/tempo-server.log
            ${{ runner.temp }}/tempo-browser-artifacts/
      - name: Upload tested public assets
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    outputs:
      page_url: ${{ steps.deployment.outputs.page_url }}
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check GitHub Pages configuration
        uses: actions/configure-pages@v5
      - name: Deploy verified application
        id: deployment
        uses: actions/deploy-pages@v4

  verify-live:
    needs: deploy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install public-site browser verification tools
        run: |
          python3 -m pip install playwright==1.62.0
          python3 -m playwright install --with-deps chromium
      - name: Verify actual published Pages application
        shell: bash
        env:
          TEMPO_BASE_URL: ${{ needs.deploy.outputs.page_url }}
          TEMPO_ARTIFACTS_DIR: ${{ runner.temp }}/tempo-live-browser-artifacts
        run: |
          set +e
          python3 tests/browser_smoke.py > "$RUNNER_TEMP/tempo-live-browser-smoke.jsonl" 2>&1
          tempo_test_status=$?
          set -e
          cat "$RUNNER_TEMP/tempo-live-browser-smoke.jsonl"
          python3 scripts/ci_summary.py --log "$RUNNER_TEMP/tempo-live-browser-smoke.jsonl" --name "Published Pages browser verification" --exit-code "$tempo_test_status" || true
          exit "$tempo_test_status"
      - name: Retain public-site verification diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: public-site-verification-diagnostics
          retention-days: 7
          path: |
            ${{ runner.temp }}/tempo-live-browser-smoke.jsonl
            ${{ runner.temp }}/tempo-live-browser-artifacts/
