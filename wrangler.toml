name = "mojetempo"
main = "worker/index.mjs"
compatibility_date = "2026-10-29"
workers_dev = true

# Preserve the existing Workers Builds connection; it also publishes Pages.
[build]
command = "node scripts/cloudflare_build.mjs"

# The two personal app addresses and the existing Worker use this same D1.
[[d1_databases]]
binding = "DB"
database_name = "mojetempo-db"
database_id = "173fef7f-f0f8-430e-a3f4-47144d81038f"

[[rules]]
type = "Text"
globs = ["**/*.sql"]
fallthrough = true

[assets]
directory = "./dist"
binding = "ASSETS"
run_worker_first = ["/api/*", "/", "/index.html"]
html_handling = "auto-trailing-slash"
not_found_handling = "none"

# Local requests must retain their actual localhost origin for cookie/CSRF checks.
# Production Custom Domains otherwise rewrite that origin in Wrangler dev.
[env.local]
routes = []

[[env.local.d1_databases]]
binding = "DB"
database_name = "mojetempo-db"
