name = "mojetempo"
main = "worker/index.mjs"
compatibility_date = "2026-10-29"
workers_dev = true
routes = [
  { pattern = "moje.itfit.cz", custom_domain = true }
]

# Wrangler provisions a dedicated database on the first authorized deployment.
# Existing provisioned binding IDs are reused on subsequent deployments.
[[d1_databases]]
binding = "DB"
database_name = "mojetempo-db"

[[rules]]
type = "Text"
globs = ["**/*.sql"]
fallthrough = true

[assets]
directory = "./dist"
binding = "ASSETS"
run_worker_first = ["/api/*", "/", "/index.html"]
html_handling = "auto-trailing-slash"
not_found_handling = "none"
